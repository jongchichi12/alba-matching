<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알바 매칭 API 콘솔</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb;
  --accent: #2f6fed; --get: #15803d; --post: #2563eb; --patch: #c2410c; --delete: #b91c1c;
  --ok: #15803d; --warn: #b45309; --err: #b91c1c; --code: #f1f3f6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --panel: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2; --line: #2c323d;
    --accent: #6b9bff; --get: #4ade80; --post: #60a5fa; --patch: #fb923c; --delete: #f87171;
    --ok: #4ade80; --warn: #fbbf24; --err: #f87171; --code: #232833; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
code, pre, textarea, input { font-family: ui-monospace, Consolas, "D2Coding", monospace; font-size: 12.5px; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; }
.top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font-size: 17px; margin: 0; }
.sub { color: var(--muted); font-size: 12.5px; }
.acc { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.me { font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--code); }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 5px 10px; border-radius: 6px; font: inherit; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
nav { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 10px; }
nav button { border-radius: 999px; }
nav button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.ids { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.ids label { display: flex; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); }
.ids input { width: 52px; padding: 2px 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 16px; padding: 16px; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .logwrap { position: static !important; max-height: none !important; } }
.tab { display: none; } .tab.on { display: block; }
.ghead { margin: 0 0 12px; }
.ghead h2 { margin: 0; font-size: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.chead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chead code { font-size: 14px; font-weight: 600; }
.m { font: 700 11px/1 ui-monospace, monospace; padding: 4px 6px; border-radius: 4px; color: #fff; min-width: 50px; text-align: center; }
.m.GET { background: var(--get); } .m.POST { background: var(--post); } .m.PATCH { background: var(--patch); } .m.DELETE { background: var(--delete); }
@media (prefers-color-scheme: dark) { .m { color: #111; } }
.star { color: #e0a800; font-weight: 700; }
.who { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); padding: 1px 7px; border-radius: 999px; }
.chain { margin: 6px 0 2px; font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
.chain b { color: var(--text); font-weight: 600; }
.desc { margin: 4px 0 8px; }
.fields { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 6px; }
.fields label { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.fields input { width: 110px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--text); }
.fields label.param input { border-color: var(--accent); }
textarea { width: 100%; min-height: 70px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--code); color: var(--text); resize: vertical; }
.actions { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
.st { font: 700 12px ui-monospace, monospace; padding: 2px 7px; border-radius: 4px; }
.s2 { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.s4 { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.s5, .s0 { background: color-mix(in srgb, var(--err) 18%, transparent); color: var(--err); }
.logwrap { position: sticky; top: 150px; max-height: calc(100vh - 170px); display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.loghead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.log { overflow: auto; padding: 8px 12px; }
.state { padding: 10px 12px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 5%, transparent); border-radius: 10px 10px 0 0; }
.state .sh { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.state .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 3px 0; }
.state .lbl { width: 62px; font-weight: 600; font-size: 12.5px; }
.state .chip { font: 11.5px ui-monospace, Consolas, monospace; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.state .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }
.state .chip.alt.on { background: var(--patch); border-color: var(--patch); }
.state .arrow { color: var(--muted); font-size: 11px; }
.state .extra { font-size: 11.5px; color: var(--muted); }
.state .none { color: var(--muted); font-size: 12px; }
.state .row.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--ok) 35%, transparent); } 100% { background: transparent; } }
@media (prefers-color-scheme: dark) { .state .chip.on { color: #111; } }
.entry { border-bottom: 1px dashed var(--line); padding: 8px 0; }
.entry .eh { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.entry .eh code { word-break: break-all; }
.entry .note { font-size: 12px; color: var(--muted); }
.entry pre { margin: 4px 0 0; padding: 6px 8px; background: var(--code); border-radius: 6px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
.entry summary { cursor: pointer; font-size: 12px; color: var(--muted); margin-top: 4px; }
.expect { font-size: 12px; font-weight: 700; }
.expect.good { color: var(--ok); } .expect.bad { color: var(--err); }
table.steps { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.steps td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.steps tr:last-child td { border-bottom: 0; }
.steps td.n { color: var(--muted); width: 28px; text-align: right; }
.steps td.k code { font-size: 12px; color: var(--muted); }
.steps td.r { width: 70px; text-align: center; }
.steps td.b { width: 60px; }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.b-owner { background: color-mix(in srgb, var(--post) 18%, transparent); color: var(--post); }
.b-worker { background: color-mix(in srgb, var(--get) 18%, transparent); color: var(--get); }
.b-other { background: color-mix(in srgb, var(--patch) 20%, transparent); color: var(--patch); }
.b-none, .b-any { background: var(--code); color: var(--muted); }
.section { margin-bottom: 22px; }
.section h2 { font-size: 16px; margin: 0 0 4px; }
.section p { margin: 0 0 10px; color: var(--muted); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 22px; }
.map div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.map div:hover { border-color: var(--accent); }
.map b { display: block; } .map span { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>알바 매칭 API 콘솔</h1>
      <div class="sub">routes → middlewares → controllers → models · 라우터 8개 · API 45개</div>
    </div>
    <div class="acc">
      <span class="me" id="me">로그인 안 됨</span>
      <button data-as="owner">사장님으로</button>
      <button data-as="worker">알바생으로</button>
      <button data-as="other">제3자로</button>
      <button data-as="none">로그아웃</button>
    </div>
  </div>
  <nav id="nav"></nav>
  <div class="ids" id="ids"><span class="sub">최근 ID (자동 입력):</span></div>
</header>

<div class="layout">
  <main id="main"></main>
  <aside class="logwrap">
    <div class="state" id="state"></div>
    <div class="loghead"><b>요청 / 응답 기록</b><button id="clear">지우기</button></div>
    <div class="log" id="log"><div class="sub">API를 실행하면 여기에 요청과 응답이 표시됩니다.</div></div>
  </aside>
</div>

<script>
// ---------------- 상태 ----------------
const ACC = {
  owner:  { email: 'boss@alba.test',   password: 'password123', name: '김사장', phone: '010-1111-1111', label: '사장님' },
  worker: { email: 'worker@alba.test', password: 'password123', name: '이알바', phone: '010-2222-2222', label: '알바생' },
  other:  { email: 'other@alba.test',  password: 'password123', name: '박제삼', phone: '010-3333-3333', label: '제3자' }
};
const S = { jobId: '', resumeId: '', applicationId: '', shiftId: '', payrollId: '', reviewId: '', notificationId: '', ownerId: '' };
let me = null;

const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const isoIn = min => new Date(Date.now() + min * 60000).toISOString();
const num = v => (v === '' || v == null ? v : Number(v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------------- API 정의 (routes/*.js 와 1:1) ----------------
const GROUPS = {
  users:         { t: '회원',     file: 'users' },
  jobs:          { t: '공고',     file: 'jobs' },
  resumes:       { t: '이력서',   file: 'resumes' },
  applications:  { t: '지원',     file: 'applications' },
  shifts:        { t: '근무 기록', file: 'shifts' },
  payrolls:      { t: '급여 정산', file: 'payrolls' },
  reviews:       { t: '후기',     file: 'reviews' },
  notifications: { t: '알림',     file: 'notifications' }
};
const L = 'isLoggedIn';
const APIS = [
  // /users
  { g: 'users', m: 'POST', p: '/users/join', mw: ['isNotLoggedIn'], c: 'join', who: '비로그인',
    d: '회원가입. 이메일 형식, 비밀번호 6~50자를 검사하고 비밀번호는 bcrypt 로 해시해 저장. 이메일 중복이면 409.',
    body: () => ({ email: 'new@alba.test', password: 'password123', name: '새회원', phone: '010-0000-0000' }) },
  { g: 'users', m: 'POST', p: '/users/login', mw: ['isNotLoggedIn'], c: 'login', who: '비로그인',
    d: 'Passport local 전략으로 이메일 로그인 → 세션 쿠키 발급. 불일치면 401.',
    body: () => ({ email: ACC.owner.email, password: ACC.owner.password }) },
  { g: 'users', m: 'POST', p: '/users/logout', mw: [L], c: 'logout', who: '로그인', d: '로그아웃 (세션 삭제).' },
  { g: 'users', m: 'GET', p: '/users/me', mw: [L], c: 'me', who: '로그인', d: '내 정보 (비밀번호 제외).' },

  // /jobs
  { g: 'jobs', m: 'GET', p: '/jobs', mw: [], c: 'list', who: '누구나', star: true,
    d: '공고 목록. region 은 부분 일치, category 는 정확히 일치, minPay 이상, status 기본값 open (all 가능), 페이지네이션 (limit 최대 50).',
    q: { region: '', category: '', minPay: '', status: 'open', page: '1', limit: '10' },
    save: d => { if (!S.jobId && d.jobs[0]) S.jobId = d.jobs[0].id; } },
  { g: 'jobs', m: 'GET', p: '/jobs/:id', idKey: 'jobId', mw: [], c: 'detail', who: '누구나',
    d: '공고 상세. 확정 인원(confirmedCount)을 함께 돌려준다.' },
  { g: 'jobs', m: 'POST', p: '/jobs', mw: [L], c: 'create', who: '사장님',
    d: '공고 등록. 제목·지역·시급·모집인원 필수, 시급은 2026 최저임금 10,320원 이상. ownerId 는 서버가 로그인 사용자로 채운다.',
    body: () => ({ title: '주말 카페 바리스타', category: '카페', region: '서울 마포구', pay: 10500, headcount: 1 }),
    save: d => { S.jobId = d.id; S.ownerId = d.ownerId; } },
  { g: 'jobs', m: 'PATCH', p: '/jobs/:id', idKey: 'jobId', mw: [L, 'isJobOwner'], c: 'update', who: '공고 작성자',
    d: '공고 수정. body 에 status 가 있으면 400 (상태는 전용 API), 모집인원을 확정 인원보다 줄이면 409.',
    body: () => ({ pay: 11000, headcount: 2 }) },
  { g: 'jobs', m: 'DELETE', p: '/jobs/:id', idKey: 'jobId', mw: [L, 'isJobOwner'], c: 'remove', who: '공고 작성자',
    d: '공고 삭제. 확정·완료된 지원이 있으면 409, 대기·거절 지원만 있으면 함께 삭제.' },
  { g: 'jobs', m: 'PATCH', p: '/jobs/:id/status', idKey: 'jobId', mw: [L, 'isJobOwner'], c: 'changeStatus', who: '공고 작성자',
    d: '조기 마감(closed) / 재오픈(open). 정원이 찬 공고는 재오픈 시 409.',
    body: () => ({ status: 'closed' }) },

  // /resumes
  { g: 'resumes', m: 'GET', p: '/resumes/me', mw: [L], c: 'listMine', who: '알바생', d: '내 이력서 목록. (라우터에서 /:id 보다 먼저 선언)',
    save: d => { if (!S.resumeId && d[0]) S.resumeId = d[0].id; } },
  { g: 'resumes', m: 'GET', p: '/resumes/:id', idKey: 'resumeId', mw: [L, 'canViewResume'], c: 'detail', who: '본인 · 지원받은 사장님',
    d: '이력서 상세. 본인이거나, 이 이력서로 지원받은 공고의 주인만 열람 가능 (그 외 403).' },
  { g: 'resumes', m: 'GET', p: '/resumes/:id/careers', idKey: 'resumeId', mw: [L, 'canViewResume'], c: 'careers', who: '본인 · 지원받은 사장님', star: true,
    d: '인증 경력. 저장하지 않고 완료된 지원 + 확인된 근무 기록으로 매번 계산 (조작 불가). 근무 분·일수, 결근 수, 사장님 평점 집계.' },
  { g: 'resumes', m: 'POST', p: '/resumes', mw: [L], c: 'create', who: '알바생',
    d: '이력서 작성. 제목·자기소개·희망지역 필수, 한 사람이 여러 개 가능.',
    body: () => ({ title: '성실한 카페 경력자', intro: '바리스타 6개월 경험이 있습니다.', desiredRegion: '서울 마포구' }),
    save: 'resumeId' },
  { g: 'resumes', m: 'PATCH', p: '/resumes/:id', idKey: 'resumeId', mw: [L, 'isResumeOwner'], c: 'update', who: '이력서 작성자',
    d: '이력서 수정.', body: () => ({ intro: '바리스타 1년 경험이 있습니다.' }) },
  { g: 'resumes', m: 'DELETE', p: '/resumes/:id', idKey: 'resumeId', mw: [L, 'isResumeOwner'], c: 'remove', who: '이력서 작성자',
    d: '이력서 삭제. 대기·확정 지원에 쓰이는 중이면 409. 완료된 지원은 resumeId 만 null 이 되어 경력은 유지.' },

  // /applications
  { g: 'applications', m: 'POST', p: '/applications', mw: [L], c: 'apply', who: '알바생',
    d: '지원하기. 본인 이력서만, 본인 공고 403, 마감 공고·중복 지원 409. 지원 생성 + 사장님 알림을 한 트랜잭션으로.',
    body: () => ({ jobId: num(S.jobId), resumeId: num(S.resumeId), message: '주말 모두 가능합니다!' }),
    save: 'applicationId' },
  { g: 'applications', m: 'GET', p: '/applications/sent', mw: [L], c: 'listSent', who: '알바생',
    d: '내가 지원한 목록.', q: { status: '' } },
  { g: 'applications', m: 'GET', p: '/applications/received', mw: [L], c: 'listReceived', who: '사장님',
    d: '내 공고로 들어온 지원. 남의 jobId 를 넣어도 include 조건 때문에 0건.', q: { status: '', jobId: '' },
    save: d => { if (!S.applicationId && d[0]) S.applicationId = d[0].id; } },
  { g: 'applications', m: 'PATCH', p: '/applications/:id/accept', idKey: 'applicationId', mw: [L, 'isJobOwnerOfApplication'], c: 'accept', who: '공고 작성자', star: true,
    d: '채용 확정. 공고 행을 잠그고(FOR UPDATE) 정원 확인 → 확정 → 정원이 차면 공고 자동 마감 → 알림, 모두 한 트랜잭션. 대기 아님·마감·정원 참이면 409.' },
  { g: 'applications', m: 'PATCH', p: '/applications/:id/reject', idKey: 'applicationId', mw: [L, 'isJobOwnerOfApplication'], c: 'reject', who: '공고 작성자',
    d: '지원 거절 (대기 상태만, 아니면 409).' },
  { g: 'applications', m: 'PATCH', p: '/applications/:id/complete', idKey: 'applicationId', mw: [L, 'isJobOwnerOfApplication'], c: 'complete', who: '공고 작성자',
    d: '근무 완료 + 성실도 평점(1~5). 모든 일정이 확인/결근으로 끝나 있고 확인된 근무가 1건 이상이어야 함 (아니면 409).',
    body: () => ({ rating: 5 }) },

  // /shifts
  { g: 'shifts', m: 'POST', p: '/shifts', mw: [L], c: 'create', who: '사장님',
    d: '근무 일정 등록 (확정된 지원만). 같은 알바생의 다른 일정과 시간이 겹치면 409. 시연용으로 지금부터 1분짜리 일정이 채워진다. 결근 처리를 보려면 startAt 을 과거로 바꿔서 등록.',
    body: () => ({ applicationId: num(S.applicationId), startAt: isoIn(0), endAt: isoIn(1) }),
    save: 'shiftId' },
  { g: 'shifts', m: 'GET', p: '/shifts/me', mw: [L], c: 'listMine', who: '알바생', d: '내 근무 일정 (from/to 기간 필터, ISO 날짜).', q: { from: '', to: '' } },

// ---------------- HTTP ----------------
const meLabel = () => (me ? me.name : '비로그인');

async function call(m, url, body, meta = {}) {
  const opt = { method: m, headers: {}, credentials: 'same-origin' };
  if (body !== undefined && m !== 'GET') { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let status = 0, json = null;
  const who = meLabel();
  try {
    const res = await fetch(url, opt);
    status = res.status;
    json = await res.json().catch(() => null);
  } catch (e) { json = { error: '서버에 연결할 수 없습니다: ' + e.message }; }
  log({ m, url, body: opt.body ? body : undefined, status, json, who, note: meta.note, expect: meta.expect });
  refreshState();
  return { status, json };
}

function setMe(u) {
  me = u;
  if (u && u.email === ACC.owner.email) S.ownerId = u.id;
  document.getElementById('me').textContent = u ? `${u.name} (${u.email})` : '로그인 안 됨';
  renderIds(); refillAll(); refreshState();
}

async function silentMe() {
  try {
    const r = await fetch('/users/me', { credentials: 'same-origin' });
    setMe(r.ok ? (await r.json()).data : null);
  } catch { setMe(null); }
}

// 계정 전환: 로그아웃 → 로그인 (없으면 가입 후 로그인)
async function become(who) {
  if (who === 'any') return;
  if (who === 'none') { if (me) { await call('POST', '/users/logout', undefined, { note: '계정 전환' }); setMe(null); } return; }
  const a = ACC[who];
  if (me && me.email === a.email) return;
  if (me) { await call('POST', '/users/logout', undefined, { note: '계정 전환' }); setMe(null); }
  let r = await call('POST', '/users/login', { email: a.email, password: a.password }, { note: `${a.label} 로그인` });
  if (r.status === 401) {
    await call('POST', '/users/join', { email: a.email, password: a.password, name: a.name, phone: a.phone }, { note: `${a.label} 계정이 없어 가입` });
    r = await call('POST', '/users/login', { email: a.email, password: a.password }, { note: `${a.label} 로그인` });
  }
  if (r.status === 200) setMe(r.json.data);
}

// ---------------- API 카드 ----------------
const paramsOf = api => (api.p.match(/:\w+/g) || []).map(s => s.slice(1));
const keyFor = (api, name) => (name === 'id' ? api.idKey : name);

function buildUrl(api, params, query) {
  let url = api.p.replace(/:(\w+)/g, (_, n) => encodeURIComponent(params[n] ?? ''));
  const qs = new URLSearchParams(Object.entries(query || {}).filter(([, v]) => v !== '' && v != null)).toString();
  return qs ? `${url}?${qs}` : url;
}

function applySave(api, status, json) {
  if (status >= 300 || !json || json.result !== 'Success' || !api.save) return;
  if (typeof api.save === 'function') api.save(json.data);
  else S[api.save] = json.data.id;
  renderIds(); refillAll(); refreshState();
}

function cardHtml(api) {
  const chain = [`routes/${GROUPS[api.g].file}.js`, ...api.mw.map(x => `<b>${x}</b>`), `controllers/${GROUPS[api.g].file}.<b>${api.c}</b>`].join(' → ');
  const params = paramsOf(api).map(n => `<label class="param">:${n} <input data-param="${n}"></label>`).join('');
  const query = Object.keys(api.q || {}).map(n => `<label>?${n} <input data-query="${n}"></label>`).join('');
  return `
    <div class="chead"><span class="m ${api.m}">${api.m}</span><code>${api.p}</code>${api.star ? '<span class="star">★</span>' : ''}<span class="who">${esc(api.who)}</span></div>
    <div class="chain">${chain}</div>
    <div class="desc">${esc(api.d)}</div>
    ${params || query ? `<div class="fields">${params}${query}</div>` : ''}
    ${api.body ? '<textarea spellcheck="false"></textarea>' : ''}
    <div class="actions"><button class="primary" data-run>실행</button><button data-reset title="최근 ID와 기본값으로 다시 채우기">↺ 기본값</button><span data-st></span></div>`;
}

function fillCard(card, force) {
  if (card.dataset.dirty && !force) return;
  const api = API[card.dataset.key];
  card.querySelectorAll('[data-param]').forEach(i => { i.value = S[keyFor(api, i.dataset.param)] ?? ''; });
  card.querySelectorAll('[data-query]').forEach(i => { i.value = api.q[i.dataset.query]; });
  const ta = card.querySelector('textarea');
  if (ta) ta.value = JSON.stringify(api.body(), null, 2);
  if (force) delete card.dataset.dirty;
}
const refillAll = () => document.querySelectorAll('.card').forEach(c => fillCard(c));

async function runCard(card) {
  const api = API[card.dataset.key];
  fillCard(card); // 수정하지 않은 카드는 최신 값(시간 등)으로 다시 채운다
  const params = {}, query = {};
  card.querySelectorAll('[data-param]').forEach(i => { params[i.dataset.param] = i.value.trim(); });
  card.querySelectorAll('[data-query]').forEach(i => { query[i.dataset.query] = i.value.trim(); });
  let body;
  const ta = card.querySelector('textarea');
  if (ta) { try { body = JSON.parse(ta.value || '{}'); } catch { alert('body 가 올바른 JSON 이 아닙니다.'); return; } }
  const btn = card.querySelector('[data-run]'); btn.disabled = true;
  const r = await call(api.m, buildUrl(api, params, query), body);
  btn.disabled = false;
  card.querySelector('[data-st]').innerHTML = `<span class="st s${Math.floor(r.status / 100)}">${r.status}</span>`;
  applySave(api, r.status, r.json);
  if (api.g === 'users') await silentMe();
}

// ---------------- 시나리오 실행 ----------------
const WHO = { owner: '사장님', worker: '알바생', other: '제3자', none: '비로그인', any: '아무나' };
const waitBox = () => document.getElementById('waitMin');

async function runStep(step, row) {
  const cell = row.querySelector('.r');
  cell.textContent = '…';
  await become(step.who);
  const api = API[step.k];
  if (step.wait && waitBox() && waitBox().checked) {
    for (let s = 61; s > 0; s--) { cell.textContent = `${s}초`; await sleep(1000); }
  }
  const params = {};
  paramsOf(api).forEach(n => { params[n] = (step.params && step.params[n]) ?? S[keyFor(api, n)]; });
  const query = api.q ? { ...api.q } : undefined;
  const body = step.body ? step.body() : api.body ? api.body() : undefined;
  const r = await call(api.m, buildUrl(api, params, query), body, { note: step.t, expect: step.expect });
  if (!step.nosave) applySave(api, r.status, r.json);
  const ok = step.expect ? r.status === step.expect : r.status >= 200 && r.status < 300;
  cell.innerHTML = `<span class="st s${Math.floor(r.status / 100)}">${r.status}</span> ${ok ? '✓' : '✗'}`;
  return ok;
}

function stepsHtml(list, id) {
  return `<table class="steps" id="${id}">${list.map((s, i) => `
    <tr><td class="n">${i + 1}</td><td><span class="badge b-${s.who}">${WHO[s.who]}</span></td>
    <td>${esc(s.t)}<div class="k"><code>${s.k}</code>${s.expect ? ` · 기대 <b>${s.expect}</b>` : ''}</div></td>
    <td class="r"></td><td class="b"><button data-step="${i}">실행</button></td></tr>`).join('')}</table>`;
}

function bindSteps(list, tableId, allBtnId) {
  const table = document.getElementById(tableId);
  table.addEventListener('click', async e => {
    const b = e.target.closest('[data-step]'); if (!b) return;
    b.disabled = true; await runStep(list[+b.dataset.step], b.closest('tr')); b.disabled = false;
  });
  document.getElementById(allBtnId).addEventListener('click', async e => {
    const btn = e.target; btn.disabled = true;
    table.querySelectorAll('.r').forEach(c => { c.textContent = ''; });
    const rows = table.querySelectorAll('tr');
    for (let i = 0; i < list.length; i++) {
      rows[i].scrollIntoView({ block: 'nearest' });
      if (!await runStep(list[i], rows[i])) break;
    }
    btn.disabled = false;
  });
}

      }
      if (me && S.applicationId) {
        const a = findById([await getData('/applications/sent'), await getData('/applications/received')], S.applicationId);
        if (a) ST.application = { id: a.id, status: a.status, extra: a.ownerRating ? `성실도 ${a.ownerRating}점` : '' };
      }
      if (me && S.shiftId) {
        const s = findById([await getData('/shifts/me'), S.jobId ? await getData('/shifts/jobs/' + S.jobId) : null], S.shiftId);
        if (s) ST.shift = { id: s.id, status: s.status, extra: s.workedMinutes != null ? `근무 ${s.workedMinutes}분` : '' };
      }
      if (me && S.payrollId) {
        const p = findById([await getData('/payrolls/me'), await getData('/payrolls/issued')], S.payrollId);
        if (p) ST.payroll = { id: p.id, status: p.status, extra: `${Number(p.totalPay).toLocaleString()}원 (기본 ${Number(p.basePay).toLocaleString()} + 주휴 ${Number(p.weeklyHolidayPay).toLocaleString()})` };
      }
      unread = me ? (await getData('/notifications/unread-count') || {}).count ?? null : null;
      renderState();
    } while (again);
  } finally { refreshing = false; }
}

function renderState() {
  const box = document.getElementById('state');
  const rows = Object.entries(FLOWS).map(([k, f]) => {
    const cur = ST[k];
    if (!cur) return `<div class="row"><span class="lbl">${f.t}</span><span class="none">아직 없음</span></div>`;
    const changed = shown[k] !== undefined && shown[k] !== cur.status;
    shown[k] = cur.status;
    const chips = f.seq.map(s => `<span class="chip ${s === cur.status ? 'on' : ''}">${s}</span>`).join('<span class="arrow">→</span>');
    const alts = f.alt.map(s => `<span class="chip alt ${s === cur.status ? 'on' : ''}">${s}</span>`).join('');
    return `<div class="row ${changed ? 'flash' : ''}"><span class="lbl">${f.t} #${cur.id}</span>${chips}${alts ? '<span class="arrow">/</span>' + alts : ''}${cur.extra ? `<div class="extra">${esc(cur.extra)}</div>` : ''}</div>`;
  }).join('');
  box.innerHTML = `<div class="sh"><b>현재 상태</b><span class="sub">${me ? esc(me.name) + ' · 안읽은 알림 ' + (unread ?? '-') + '개' : '비로그인'}</span></div>${rows}`;
}

// ---------------- 기록 ----------------
function log(e) {
  const box = document.getElementById('log');
  if (box.firstElementChild && box.firstElementChild.classList.contains('sub')) box.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'entry';
  const cls = `s${Math.floor(e.status / 100)}`;
  const exp = e.expect ? `<span class="expect ${e.status === e.expect ? 'good' : 'bad'}">${e.status === e.expect ? '✓ 기대대로' : '✗ 기대 ' + e.expect}</span>` : '';
  div.innerHTML = `
    <div class="eh"><span class="m ${e.m}">${e.m}</span><code>${esc(e.url)}</code><span class="st ${cls}">${e.status || 'ERR'}</span>${exp}</div>
    <div class="note">as ${esc(e.who)}${e.note ? ' · ' + esc(e.note) : ''}</div>
    ${e.body !== undefined ? `<details><summary>요청 body</summary><pre>${esc(JSON.stringify(e.body, null, 2))}</pre></details>` : ''}
    <details open><summary>응답</summary><pre>${esc(JSON.stringify(e.json, null, 2))}</pre></details>`;
  box.prepend(div);
  while (box.children.length > 120) box.lastElementChild.remove();
  // 이전 기록의 응답은 접어서 최신 것만 펼쳐 둔다
  [...box.children].slice(1, 3).forEach(x => { const d = x.querySelector('details[open]'); if (d) d.open = false; });
}

function renderIds() {
  const box = document.getElementById('ids');
  Object.keys(S).forEach(k => {
    let inp = box.querySelector(`[data-id="${k}"]`);
    if (!inp) {
      const lab = document.createElement('label');
      lab.innerHTML = `${k} <input data-id="${k}">`;
      box.appendChild(lab);
      inp = lab.querySelector('input');
      inp.addEventListener('change', () => { S[k] = inp.value.trim(); refillAll(); refreshState(); });
    }
    if (document.activeElement !== inp) inp.value = S[k];
  });
}

// ---------------- 화면 구성 ----------------
function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.id === 'tab-' + id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  window.scrollTo({ top: 0 });
}

function build() {
  const nav = document.getElementById('nav');
  const main = document.getElementById('main');
  const count = g => APIS.filter(a => a.g === g).length;

  nav.innerHTML = `<button data-tab="flow">▶ 시나리오</button>` +
    Object.entries(GROUPS).map(([g, v]) => `<button data-tab="${g}">/${g} ${v.t} (${count(g)})</button>`).join('');
  nav.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) showTab(b.dataset.tab); });

  // 시나리오 탭
  const flow = document.createElement('section');
  flow.className = 'tab'; flow.id = 'tab-flow';
  flow.innerHTML = `
    <div class="map">${Object.entries(GROUPS).map(([g, v]) => `<div data-go="${g}"><b>/${g}</b><span>${v.t} · API ${count(g)}개 · routes/${v.file}.js</span></div>`).join('')}</div>
    <div class="section">
      <h2>1. 전체 업무 흐름</h2>
      <p>공고 → 지원 → 확정 → 근무(출퇴근) → 확인 → 정산 → 완료 → 인증 경력 → 후기. 단계마다 필요한 계정으로 자동 전환합니다 (계정이 없으면 자동 가입).</p>
      <div class="bar"><button class="primary" id="flowAll">▶ 전체 실행</button>
        <label class="sub"><input type="checkbox" id="waitMin"> 퇴근 전 1분 기다리기 (근무 1분 → 급여가 0원이 아니게)</label></div>
      ${stepsHtml(FLOW, 'flowTable')}
    </div>
    <div class="section">
      <h2>2. 권한 · 상태 규칙 시연</h2>
      <p>1번 흐름을 먼저 실행한 뒤 눌러 주세요. 401 로그인 · 403 권한(미들웨어) · 404 없음 · 409 상태 충돌(컨트롤러) · 400 입력 오류가 설계대로 나오는지 확인합니다.</p>
      <div class="bar"><button class="primary" id="rulesAll">▶ 전체 실행</button></div>
      ${stepsHtml(RULES, 'rulesTable')}
    </div>`;
  main.appendChild(flow);
  flow.querySelector('.map').addEventListener('click', e => { const d = e.target.closest('[data-go]'); if (d) showTab(d.dataset.go); });

  // 라우터별 탭
  for (const [g, v] of Object.entries(GROUPS)) {
    const tab = document.createElement('section');
    tab.className = 'tab'; tab.id = 'tab-' + g;
    tab.innerHTML = `<div class="ghead"><h2>/${g} · ${v.t}</h2><div class="sub">app.use('/${g}', ${g}Router) · routes/${v.file}.js · ★ 핵심 API</div></div>`;
    for (const api of APIS.filter(a => a.g === g)) {
      const card = document.createElement('div');
      card.className = 'card'; card.dataset.key = `${api.m} ${api.p}`;
      card.innerHTML = cardHtml(api);
      card.addEventListener('input', () => { card.dataset.dirty = '1'; });
      card.querySelector('[data-run]').addEventListener('click', () => runCard(card));
      card.querySelector('[data-reset]').addEventListener('click', () => fillCard(card, true));
      tab.appendChild(card);
    }
    main.appendChild(tab);
  }

  bindSteps(FLOW, 'flowTable', 'flowAll');
  bindSteps(RULES, 'rulesTable', 'rulesAll');

  document.querySelectorAll('[data-as]').forEach(b => b.addEventListener('click', () => become(b.dataset.as)));
  document.getElementById('clear').addEventListener('click', () => { document.getElementById('log').innerHTML = ''; });

  renderIds(); refillAll(); renderState(); showTab('flow'); silentMe();
}
build();
</script>
</body>
</html>
